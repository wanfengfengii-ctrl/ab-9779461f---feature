server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态服务健康检查地址
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
